name: Release extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-release
          path: dist
      - name: Verify downloaded assets
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Upload verified candidate and publish Release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            extra=()
            if [[ "$RELEASE_VERSION" == *-* ]]; then extra+=(--prerelease); fi
            gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --generate-notes \
              --title "XGWX Workspace Editor $RELEASE_VERSION" "${extra[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false
